[project]
name = "market-research-advisor"
version = "0.1.0"
description = "Agentic market and marketing research: a planner fans out to live data, search, news and internal docs, then writes a sourced, timestamped brief"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advisor*"]
